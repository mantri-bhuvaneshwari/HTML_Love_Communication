<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hi....? ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }

        .container {
            background: white;
            width: 90%;
            max-width: 560px;
            padding: 45px 30px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 25px;
            font-size: 34px;
        }

        p {
            line-height: 1.5;
        }

        /* HEART */
        .heart {
            font-size: 75px;
            margin-bottom: 15px;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }

        /* BUTTONS */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            border: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        /* YES BUTTON */
        .yes {
            background: #ff4d6d;
            color: white;
        }

        .yes:hover {
            background: #e63956;
            transform: scale(1.08);
        }

        /* NO BUTTON */
        .no {
            background: #ddd;
            color: #333;
        }

        .no:hover {
            background: #bbb;
            transform: scale(1.05);
        }

        /* NO MESSAGE */
        .message {
            display: none;
            margin-top: 25px;
            font-size: 20px;
            color: #ff4d6d;
            font-weight: bold;
        }

        /* DATE PAGE */
        #datePage {
            display: none;
        }

        .small-text {
            font-size: 20px;
            color: #555;
            margin-bottom: 10px;
        }

        /* DATE INPUT */
        input[type="date"] {
            width: 100%;
            padding: 16px;
            margin: 25px 0;
            border: 2px solid #ff9a9e;
            border-radius: 12px;
            font-size: 17px;
            outline: none;
        }

        input[type="date"]:focus {
            border-color: #ff4d6d;
        }

        /* BOOK BUTTON */
        .book {
            background: #ff4d6d;
            color: white;
            width: 100%;
        }

        .book:hover {
            background: #e63956;
            transform: scale(1.03);
        }

        /* BOOKING CONFIRMATION */
        #bookingMessage {
            display: none;
            margin-top: 28px;
            color: #ff4d6d;
            font-size: 22px;
            font-weight: bold;
            line-height: 1.7;
        }

        .love-message {
            color: #555;
            font-size: 21px;
            line-height: 1.6;
        }
    </style>
</head>

<body>


    <!-- ================================= -->
    <!-- FIRST PAGE -->
    <!-- ================================= -->

    <div class="container" id="questionPage">

        <div class="heart">
            ❤️
        </div>

        <h1>
            Hi Vinny, Do you love me?
        </h1>

        <div class="buttons">

            <button class="yes" onclick="yesClicked()">
                Yes ❤️
            </button>

            <button class="no" onclick="noClicked()">
                No 😭
            </button>

        </div>

        <!-- This appears ONLY when No is clicked -->
        <div class="message" id="noMessage">
            You don't really love me 😭💔
        </div>

    </div>



    <!-- ================================= -->
    <!-- MARRIAGE DATE PAGE -->
    <!-- ================================= -->

    <div class="container" id="datePage">

        <div class="heart">
            🥰
        </div>

        <h1>
            When will you marry me?
        </h1>

        <p class="small-text">
            Choose a date for our Marriage 💕
        </p>

        <input
            type="date"
            id="dateInput"
        >

        <button
            class="book"
            onclick="bookDate()"
        >
            Book Our Date 💕
        </button>


        <!--
            IMPORTANT:
            This is hidden initially.

            It will appear ONLY after
            clicking "Book Our Date".
        -->

        <div id="bookingMessage"></div>

    </div>



    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script>


        // =================================
        // NO BUTTON
        // =================================

        function noClicked() {

            const message =
                document.getElementById("noMessage");

            message.style.display = "block";

        }



        // =================================
        // YES BUTTON
        // =================================

        function yesClicked() {

            const questionPage =
                document.getElementById("questionPage");


            // Show love message

            questionPage.innerHTML = `

                <div class="heart">
                    🥰
                </div>

                <h1>
                    I love you too Bava! ❤️
                </h1>

                <p class="love-message">
                    You just made me very happy! 💕
                </p>

            `;


            // Wait 2 seconds

            setTimeout(function() {

                // Hide first page

                questionPage.style.display = "none";


                // Show marriage page

                document.getElementById("datePage")
                    .style.display = "block";

            }, 2000);

        }



        // =================================
        // BOOK MARRIAGE DATE
        // =================================

        function bookDate() {

            const dateInput =
                document.getElementById("dateInput");

            const message =
                document.getElementById("bookingMessage");


            const selectedDate =
                dateInput.value;


            // =================================
            // NO DATE SELECTED
            // =================================

            if (selectedDate === "") {

                message.style.display = "block";

                message.innerHTML =
                    "Please choose a date first 😌❤️";

                return;

            }


            // =================================
            // CONVERT DATE
            // =================================

            const dateObject =
                new Date(selectedDate + "T00:00:00");


            const formattedDate =
                dateObject.toLocaleDateString(
                    "en-IN",
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );


            // =================================
            // SHOW CONFIRMATION
            // =================================

            message.style.display = "block";

            message.innerHTML = `

                It's a date! ❤️
                <br>
                <br>

                Will marry on
                <strong>${formattedDate}</strong>
                🥰💕
            
            `;

        }

    </script>

</body>
</html>
