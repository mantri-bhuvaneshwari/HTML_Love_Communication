<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Do You Love Me? ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }

        .container {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 40px 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 25px;
            font-size: 30px;
        }

        p {
            line-height: 1.5;
        }

        .heart {
            font-size: 70px;
            margin-bottom: 15px;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            border: none;
            padding: 13px 30px;
            border-radius: 25px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }

        .yes {
            background: #ff4d6d;
            color: white;
        }

        .yes:hover {
            background: #e63956;
            transform: scale(1.08);
        }

        .no {
            background: #ddd;
            color: #333;
        }

        .no:hover {
            background: #bbb;
            transform: scale(1.05);
        }

        .message {
            display: none;
            margin-top: 25px;
            font-size: 20px;
            color: #ff4d6d;
            font-weight: bold;
        }

        #datePage {
            display: none;
        }

        input[type="date"] {
            width: 100%;
            padding: 14px;
            margin: 20px 0;
            border: 2px solid #ff9a9e;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input[type="date"]:focus {
            border-color: #ff4d6d;
        }

        .book {
            background: #ff4d6d;
            color: white;
            width: 100%;
        }

        .book:hover {
            background: #e63956;
            transform: scale(1.03);
        }

        #bookingMessage {
            display: none;
            margin-top: 20px;
            color: #ff4d6d;
            font-size: 19px;
            font-weight: bold;
            line-height: 1.5;
        }

        .love-message {
            color: #555;
            font-size: 20px;
            line-height: 1.6;
        }

        .small-text {
            font-size: 18px;
            color: #555;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <!-- ========================= -->
    <!-- FIRST PAGE -->
    <!-- ========================= -->

    <div class="container" id="questionPage">

        <div class="heart">❤️</div>

        <h1>Do you love me?</h1>

        <div class="buttons">

            <button class="yes" onclick="yesClicked()">
                Yes ❤️
            </button>

            <button class="no" onclick="noClicked()">
                No 😭
            </button>

        </div>

        <div class="message" id="noMessage">
            You don't really love me 😭💔
        </div>

    </div>


    <!-- ========================= -->
    <!-- DATE BOOKING PAGE -->
    <!-- ========================= -->

    <div class="container" id="datePage">

        <div class="heart">🥰</div>

        <h1>When will you meet me?</h1>

        <p class="small-text">
            Choose a date for our special meeting ❤️
        </p>

        <input type="date" id="dateInput">

        <button class="book" onclick="bookDate()">
            Book Our Date 💕
        </button>

        <div id="bookingMessage"></div>

    </div>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script>

        // =========================
        // NO BUTTON
        // =========================

        function noClicked() {

            const message =
                document.getElementById("noMessage");

            message.style.display = "block";

        }


        // =========================
        // YES BUTTON
        // =========================

        function yesClicked() {

            const questionPage =
                document.getElementById("questionPage");

            // Show "I love you too" message
            questionPage.innerHTML = `

                <div class="heart">🥰</div>

                <h1>I love you too! ❤️</h1>

                <p class="love-message">
                    You just made me very happy! 💕
                </p>

            `;

            // Wait 2 seconds and then show date page
            setTimeout(function() {

                questionPage.style.display = "none";

                document.getElementById("datePage")
                    .style.display = "block";

            }, 2000);

        }


        // =========================
        // BOOK DATE
        // =========================

        function bookDate() {

            const selectedDate =
                document.getElementById("dateInput").value;

            const message =
                document.getElementById("bookingMessage");


            // Check if date was selected
            if (selectedDate === "") {

                message.style.display = "block";

                message.innerHTML =
                    "Please choose a date first 😌❤️";

                return;

            }


            // Convert date to a nicer format
            const dateObject =
                new Date(selectedDate + "T00:00:00");

            const formattedDate =
                dateObject.toLocaleDateString("en-IN", {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                });


            // Display booking confirmation
            message.style.display = "block";

            message.innerHTML =

                "It's a date! ❤️<br><br>" +

                "I will meet you on " +

                formattedDate +

                " 🥰💕";

        }

    </script>

</body>
</html>
